[tool.poetry]
name = "practice"
version = "0.1.0"
description = "Project to practice the code from the thinkstats book"
authors = ["samantoz <samantoz@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
numpy = "*"
pandas = "*"
matplotlib = "*"
scipy = "*"
jupyter = "*"
networkx = "^3.5"
sympy = "^1.14.0"
utils = "^1.0.2"
empiricaldist = "^0.9.0"
statsmodels = "^0.14.5"
